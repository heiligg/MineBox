name: Nightly MineBox image

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: minebox-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nightly-build:
    name: Nightly pi-gen build
    uses: ./.github/workflows/build-image.yml
