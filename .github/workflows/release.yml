name: Draft Release (MineBox image)

on:
  push:
    tags:
      - "v*"

concurrency:
  group: minebox-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  BUILDER: MineBox-OS-Builder-v0.2
  IMAGE_ARTIFACT: MineBox-OS-RPi5-image

jobs:
  build:
    name: Build image for tag
    uses: ./.github/workflows/build-image.yml

  draft-release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out MineBox
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: release-assets

      - name: Download validation artifact
        uses: actions/download-artifact@v4
        with:
          name: MineBox-OS-RPi5-validation
          path: release-validation
        continue-on-error: true

      - name: Verify checksums and prepare assets
        id: prep
        run: |
          set -euo pipefail
          ls -lah release-assets
          VERSION="$(tr -d '\r' <"${BUILDER}/VERSION" | head -n1)"
          TAG="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

          cd release-assets
          if [[ ! -f SHA256SUMS ]]; then
            echo "ERROR: SHA256SUMS missing from artifact"
            exit 1
          fi
          sha256sum -c SHA256SUMS

          XZ="$(ls -1 *.img.xz | head -n1)"
          [[ -n "$XZ" ]] || { echo "ERROR: no .img.xz in artifact"; exit 1; }
          echo "xz=${XZ}" >>"$GITHUB_OUTPUT"

          # Stage docs for release upload
          mkdir -p staged
          cp -v "$XZ" SHA256SUMS staged/
          [[ -f build-manifest.json ]] && cp -v build-manifest.json staged/
          [[ -f ../release-validation/build-manifest.json ]] && \
            cp -v ../release-validation/build-manifest.json staged/build-manifest.json || true

          if [[ -f "${BUILDER}/releases/MineBox_OS_Prototype_v1.0/README_RELEASE.md" ]]; then
            cp -v "${BUILDER}/releases/MineBox_OS_Prototype_v1.0/README_RELEASE.md" staged/
          elif [[ -f "${BUILDER}/README.md" ]]; then
            cp -v "${BUILDER}/README.md" staged/README_RELEASE.md
          fi
          if [[ -f "${BUILDER}/CHANGELOG.md" ]]; then
            cp -v "${BUILDER}/CHANGELOG.md" staged/
          fi

          # Release notes body
          {
            echo "## MineBox OS Prototype — ${TAG}"
            echo
            echo "**Package version file:** \`${VERSION}\`"
            echo
            echo "Draft release generated by GitHub Actions. **Not published automatically.**"
            echo
            echo "### Image"
            echo
            echo "- Compressed image: \`${XZ}\`"
            echo "- Verify: \`sha256sum -c SHA256SUMS\`"
            echo
            echo "### Flash"
            echo
            echo '```bash'
            echo "xz -dc ${XZ} | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync"
            echo '```'
            echo
            echo "Replace \`/dev/sdX\` with your SD device. See \`docs/v1/GitHub_Image_Build.md\`."
          } > staged/RELEASE_NOTES.md

          ls -lah staged

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MineBox OS ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          body_path: release-assets/staged/RELEASE_NOTES.md
          files: |
            release-assets/staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
