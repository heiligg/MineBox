# MineBox setup hotspot DHCP + DNS
interface=wlan0
bind-dynamic
dhcp-range=192.168.4.10,192.168.4.254,255.255.255.0,12h
dhcp-option=option:router,192.168.4.1
# Pi DNS ONLY. If 1.1.1.1/8.8.8.8 are listed first, Windows asks them for
# minebox.* and gets NXDOMAIN ("DNS address could not be found"). dnsmasq
# still forwards real internet names via the server= lines below.
dhcp-option=option:dns-server,192.168.4.1
domain-needed
bogus-priv
no-resolv
# Ignore /etc/hosts (Debian maps hostname → 127.0.1.1; that would poison clients).
no-hosts
# Do not forward RFC 6762 .local names upstream (avoids NXDOMAIN noise).
local=/local/
server=1.1.1.1
server=8.8.8.8
# Unicast-friendly setup name — Windows will NOT use unicast DNS for .local.
address=/minebox.setup/192.168.4.1
address=/minebox/192.168.4.1
# Kept for clients that honor unicast .local; hotspot UI should prefer the IP.
address=/minebox.local/192.168.4.1
# Captive / connectivity-check hosts only (not the whole internet).
address=/msftconnecttest.com/192.168.4.1
address=/www.msftconnecttest.com/192.168.4.1
address=/msftncsi.com/192.168.4.1
address=/www.msftncsi.com/192.168.4.1
address=/dns.msftncsi.com/192.168.4.1
address=/connectivitycheck.gstatic.com/192.168.4.1
address=/connectivitycheck.android.com/192.168.4.1
address=/clients3.google.com/192.168.4.1
address=/captive.apple.com/192.168.4.1
