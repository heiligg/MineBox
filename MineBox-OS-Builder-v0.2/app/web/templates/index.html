<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MineBox</title>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            max-width:900px;
            margin:auto;
            padding:40px;
            background:#202124;
            color:white;
        }

        h1{
            color:#4CAF50;
        }

        .card{
            background:#303134;
            padding:20px;
            border-radius:12px;
            margin-top:20px;
        }

        button{
            padding:12px 20px;
            margin:5px;
            font-size:16px;
        }
    </style>
</head>

<body>

<h1>MineBox</h1>

<div class="card">

<h2>Minecraft Server</h2>

<p>Status: {{ minecraft.status }}</p>
<p>Players: {{ minecraft.players }}</p>
<p>Version: {{ minecraft.version }}</p>
<p>Uptime: {{ minecraft.uptime }}</p>

</div>

<div class="card">

<h2>System</h2>

<p>CPU: {{ system.cpu_percent }}%</p>
<p>RAM: {{ system.memory_percent }}%</p>

</div>

<div class="card">

<button>Start</button>
<button>Stop</button>
<button>Restart</button>

</div>

</body>
</html>
