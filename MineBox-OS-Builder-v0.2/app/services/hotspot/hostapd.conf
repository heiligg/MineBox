country_code=US
interface=wlan0
driver=nl80211
ssid=MineBox-Setup
hw_mode=g
channel=1
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
# Keep clients associated even when ACKs are lossy (common with Pi SoftAP).
disassoc_low_ack=0
skip_inactivity_poll=1
ap_max_inactivity=600
# Avoid optional PMF which some clients mishandle on Pi SoftAP.
ieee80211w=0
wpa=2
wpa_passphrase=mineboxsetup
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
