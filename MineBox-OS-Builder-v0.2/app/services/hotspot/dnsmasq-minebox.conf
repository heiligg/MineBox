interface=wlan0
bind-dynamic
dhcp-range=192.168.4.10,192.168.4.254,255.255.255.0,12h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
domain-needed
bogus-priv
# Forward internet DNS (required so Windows/phones keep the hotspot).
no-resolv
server=1.1.1.1
server=8.8.8.8
# Friendly names for the appliance on the setup subnet.
address=/minebox.local/192.168.4.1
address=/minebox/192.168.4.1
