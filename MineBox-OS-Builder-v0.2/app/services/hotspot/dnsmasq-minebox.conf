# MineBox setup hotspot DHCP + DNS
interface=wlan0
bind-dynamic
dhcp-range=192.168.4.10,192.168.4.254,255.255.255.0,12h
dhcp-option=option:router,192.168.4.1
# Public DNS first so Windows NCSI/browsers keep working even if Pi DNS hiccups.
# Pi (192.168.4.1) still serves minebox.local and is a fallback resolver.
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8,192.168.4.1
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8
address=/minebox.local/192.168.4.1
address=/minebox/192.168.4.1
