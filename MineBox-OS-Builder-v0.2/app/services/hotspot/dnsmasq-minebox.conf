interface=wlan0
bind-dynamic
dhcp-range=192.168.4.10,192.168.4.254,255.255.255.0,12h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
domain-needed
bogus-priv
# Prefer system resolvers (upstream Wi-Fi/Ethernet), with public fallbacks.
# Do NOT set no-resolv - check-project.sh enforces that.
server=1.1.1.1
server=8.8.8.8
# Local names only - do not hijack Microsoft/Google/Apple connectivity
# domains; that breaks real internet for hotspot clients. Port-80 captive
# (minebox-captive) still redirects http://192.168.4.1 to the dashboard.
address=/minebox.local/192.168.4.1
address=/minebox/192.168.4.1
