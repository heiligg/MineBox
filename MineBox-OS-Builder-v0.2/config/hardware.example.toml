# MineBox hardware profile (example)
# Appliance path: /etc/minebox/hardware.toml
#
# Encoder is DISABLED for now (no Seesaw installed). Dual buttons use the
# classic two-button navigation scheme. Re-enable [encoder] when Hardware
# Rev D (Adafruit Product 5880) is wired.
#
# Button BCM assignments below are PROVISIONAL / UNVERIFIED_AGAINST_PCB.

[profile]
name = "raspberry_pi5"
verification = "UNVERIFIED_AGAINST_PCB"

[buttons]
# Active-low with internal pull-up (press shorts to GND).
active_level = "active_low"
pull = "up"
debounce_ms = 40
long_press_ms = 450
lockout_ms = 150
poll_ms = 5

[buttons.left]
gpio_bcm = 23
physical_pin = 16
short_action = "prev"
long_action = "back"

[buttons.right]
gpio_bcm = 17
physical_pin = 11
short_action = "next"
long_action = "select"

[encoder]
# Adafruit Seesaw Rotary Encoder — Product 5880 (I²C).
# Leave disabled until the breakout is installed; buttons stay primary nav.
enabled = false
type = "adafruit_seesaw"
status = "NOT_CONFIGURED"
i2c_bus = 1
address = 0x36
interrupt_gpio = 24
rotation_step = 1
debounce_ms = 15
long_press_ms = 700

[leds]
# Illuminated button LEDs — NOT_CONFIGURED until PCB pinout is verified.
left_status = "NOT_CONFIGURED"
right_status = "NOT_CONFIGURED"
# left_gpio_bcm = unset
# right_gpio_bcm = unset

[fan]
# Fan GPIO/PWM control — use platform cooling until PCB pinout verified.
mode = "platform"   # platform | gpio | pwm | disabled
status = "NOT_CONFIGURED"
# gpio_bcm = unset
off_below_c = 55.0
on_above_c = 65.0
warning_c = 80.0
critical_c = 90.0

[power]
# Implemented via systemd/sudoers helpers, not GPIO.
shutdown_method = "systemd"
reboot_method = "systemd"
