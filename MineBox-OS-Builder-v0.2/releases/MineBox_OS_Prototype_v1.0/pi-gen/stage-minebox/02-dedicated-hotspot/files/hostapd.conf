country_code=US
interface=wlan0
driver=nl80211
ssid=MineBox-Setup
hw_mode=g
# Prefer a quieter 2.4 GHz channel; ch1 is commonly congested.
channel=11
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
# Keep clients associated even when ACKs are lossy (common with Pi SoftAP).
disassoc_low_ack=0
skip_inactivity_poll=1
ap_max_inactivity=600
# Avoid optional PMF which some clients mishandle on Pi SoftAP.
ieee80211w=0
wpa=2
wpa_passphrase=mineboxsetup
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# Allow clients to reach the Pi (and each other if needed).
ap_isolate=0
# Reduce WPA rekey churn that drops some Intel clients mid-session.
wpa_group_rekey=86400
wpa_ptk_rekey=0
