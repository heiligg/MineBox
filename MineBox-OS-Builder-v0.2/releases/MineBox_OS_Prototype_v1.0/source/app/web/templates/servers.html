<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MineBox Servers</title>
    <style>
        :root { color-scheme: dark; --bg:#080b10; --panel:#111720; --panel2:#171f2a; --border:#263140; --text:#f3f7fb; --muted:#93a2b5; --green:#65d46e; --red:#ff6868; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:Inter,system-ui,sans-serif; color:var(--text); background:var(--bg); }
        .page { width:min(1100px, calc(100% - 32px)); margin:0 auto; padding:32px 0 60px; }
        .top { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:26px; }
        h1 { margin:0 0 6px; font-size:36px; }
        p { margin:0; color:var(--muted); }
        a,button { font:inherit; }
        .button { min-height:42px; display:inline-flex; align-items:center; justify-content:center; padding:0 15px; border:1px solid var(--border); border-radius:10px; color:var(--text); background:var(--panel2); text-decoration:none; font-weight:750; cursor:pointer; }
        .button.primary { color:#071009; border-color:var(--green); background:var(--green); }
        .button.danger { color:#ffd7d7; border-color:rgba(255,104,104,.45); background:rgba(255,104,104,.12); }
        .button:disabled { opacity:.45; cursor:not-allowed; }
        .toolbar { display:flex; gap:10px; flex-wrap:wrap; }
        .notice { min-height:22px; margin-bottom:14px; color:var(--muted); }
        .notice.error { color:#ffaaaa; }
        .notice.success { color:#a9efae; }
        .grid { display:grid; gap:14px; }
        .card { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; padding:20px; border:1px solid var(--border); border-radius:16px; background:var(--panel); }
        .card.active { border-color:rgba(101,212,110,.55); box-shadow:0 0 0 1px rgba(101,212,110,.12); }
        .title-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .server-name { margin:0; font-size:22px; }
        .badge { padding:4px 9px; border-radius:999px; color:#bdf2c1; background:rgba(101,212,110,.12); font-size:12px; font-weight:800; }
        .meta { display:flex; gap:15px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:14px; }
        .actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end; }
        .empty { padding:35px; text-align:center; border:1px dashed var(--border); border-radius:16px; color:var(--muted); }
        @media(max-width:700px){ .top,.card{display:block}.toolbar,.actions{margin-top:16px}.actions{justify-content:flex-start} }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <div>
            <h1>Server Manager</h1>
            <p>Choose which Minecraft server MineBox controls or permanently remove one.</p>
        </div>
        <div class="toolbar">
            <a class="button" href="/">Dashboard</a>
            <a class="button primary" href="/setup">+ Create server</a>
        </div>
    </header>

    <div id="notice" class="notice">Loading servers…</div>
    <section id="server-list" class="grid"></section>
</main>
<script>
const list = document.getElementById('server-list');
const notice = document.getElementById('notice');

function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = String(value ?? '');
    return element.innerHTML;
}

async function api(url, options = {}) {
    const response = await fetch(url, {
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', ...(options.headers || {})},
        ...options,
    });
    let data = {};
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) throw new Error(data.detail || data.message || `Request failed (${response.status})`);
    return data;
}

function setNotice(message, type = '') {
    notice.textContent = message;
    notice.className = `notice ${type}`.trim();
}

async function loadServers() {
    setNotice('Loading servers…');
    try {
        const data = await api('/api/v1/servers');
        if (!data.servers.length) {
            list.innerHTML = '<div class="empty">No servers are installed yet.</div>';
            setNotice('');
            return;
        }
        list.innerHTML = data.servers.map(server => `
            <article class="card ${server.active ? 'active' : ''}">
                <div>
                    <div class="title-row">
                        <h2 class="server-name">${escapeHtml(server.name)}</h2>
                        ${server.active ? '<span class="badge">Active</span>' : ''}
                    </div>
                    <div class="meta">
                        <span>Version ${escapeHtml(server.version)}</span>
                        <span>${escapeHtml(server.memory_gb)} GB RAM</span>
                        <span>Port ${escapeHtml(server.port)}</span>
                        <span>ID: ${escapeHtml(server.server_id)}</span>
                    </div>
                </div>
                <div class="actions">
                    <button class="button primary" ${server.active ? 'disabled' : ''} onclick="switchServer('${encodeURIComponent(server.server_id)}')">
                        ${server.active ? 'Selected' : 'Switch to server'}
                    </button>
                    <button class="button danger" onclick="deleteServer('${encodeURIComponent(server.server_id)}', '${escapeHtml(server.name).replaceAll("'", "&#39;")}')">Delete</button>
                </div>
            </article>`).join('');
        setNotice(`${data.count} server${data.count === 1 ? '' : 's'} installed.`);
    } catch (error) {
        setNotice(error.message, 'error');
    }
}

async function switchServer(encodedId) {
    const serverId = decodeURIComponent(encodedId);
    setNotice('Switching active server…');
    try {
        const data = await api('/api/v1/servers/active', {
            method: 'POST',
            body: JSON.stringify({server_id: serverId}),
        });
        setNotice(data.message || 'Active server changed.', 'success');
        await loadServers();
    } catch (error) { setNotice(error.message, 'error'); }
}

async function deleteServer(encodedId, name) {
    const serverId = decodeURIComponent(encodedId);
    const confirmed = window.confirm(`Permanently delete “${name}”?\n\nThis removes its world, settings, logs, plugins, and mods. This cannot be undone.`);
    if (!confirmed) return;
    setNotice(`Deleting ${name}…`);
    try {
        const data = await api(`/api/v1/servers/${encodeURIComponent(serverId)}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ confirm: true }),
        });
        setNotice(data.message || 'Server deleted.', 'success');
        await loadServers();
    } catch (error) { setNotice(error.message, 'error'); }
}

loadServers();
</script>
</body>
</html>
